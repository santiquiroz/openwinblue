name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build-service:
    name: Build & Test Service (C++)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build build/debug --target owb_service owb_service_tests

      - name: Run tests
        run: ctest --preset test-all --output-on-failure

  build-gui:
    name: Build & Test GUI (C#)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore gui/OpenWinBlue.slnx

      - name: Build
        run: dotnet build gui/OpenWinBlue.slnx -c Debug --no-restore

      - name: Test
        run: dotnet test gui/tests/OpenWinBlue.Tests/OpenWinBlue.Tests.csproj --no-build --verbosity normal

  build-driver:
    name: Build Driver (KMDF + WDK)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK 11 via chocolatey
        run: choco install windowsdriverkit11 --yes --no-progress
        shell: pwsh

      - name: Verify WDK kernel headers exist
        run: |
          $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
          # Look only in versioned subdirs (10.0.*), not 'wdf' or other non-version dirs
          $kmHeader = Get-ChildItem "$wdkRoot\Include" -Directory |
                      Where-Object { $_.Name -match '^\d+\.\d+\.' } |
                      Sort-Object Name -Descending |
                      Select-Object -First 1 |
                      ForEach-Object { "$($_.FullName)\km\ntddk.h" }
          if (-not $kmHeader -or -not (Test-Path $kmHeader)) {
            Write-Error "WDK kernel headers not found. Include dirs: $(Get-ChildItem "$wdkRoot\Include" -Directory | Select-Object -ExpandProperty Name)"
            exit 1
          }
          Write-Host "WDK OK: $kmHeader"
        shell: pwsh

      - name: Build driver with MSBuild
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild driver\owb_a2dp.vcxproj `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:SignMode=Off `
            /p:EnableInf2cat=false `
            /t:Build `
            /nologo
        shell: pwsh

      - name: Verify driver binary
        run: |
          if (-not (Test-Path "driver\x64\Debug\owb_a2dp.sys")) {
            Write-Error "owb_a2dp.sys not found"
            exit 1
          }
          $size = (Get-Item "driver\x64\Debug\owb_a2dp.sys").Length
          Write-Host "owb_a2dp.sys built: $size bytes"
        shell: pwsh
